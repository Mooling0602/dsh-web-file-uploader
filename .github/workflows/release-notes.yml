# .github/workflows/release-notes.yml — regenerate one release's notes.
#
# Use it to repair a release body: fix CHANGELOG.md on main, then run it
# manually with the tag; it writes the composed notes back to the GitHub Release
# body. It works for any published tag, not only the last one, and `ref` accepts
# any branch or commit, so upcoming notes can be previewed with `dry_run` before
# a release. markdownlint is not run here: it is a local, editor-facing check in
# this repository (see AGENTS.md).
#
# Notes are composed from the checked-out changelog source (default main), not
# from the tag's own copy: a fix lands on main after the tag. Build artifacts
# are never touched — release assets stay exactly as published (immutable
# releases included, where only the editable title and notes are writable).
name: release-notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Bare version tag whose GitHub Release notes to regenerate (for example 1.0.0-rc.1)"
        required: true
        type: string
      ref:
        description: "Git ref the notes are composed from (default main; any branch or commit works)"
        required: false
        type: string
        default: main
      dry_run:
        description: "Compose and print the notes without editing the GitHub Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write # edit the GitHub Release body

concurrency:
  group: release-notes-${{ inputs.tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  notes:
    name: Notes v${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag }}
      REF: ${{ inputs.ref }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Check out the changelog source
        uses: actions/checkout@v4
        with:
          # The input defaults to main; the fallback covers a cleared field.
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0 # every tag, so the Full Changelog link resolves

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate the inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          if ! [[ "${tag}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${tag}' is not a bare semantic version tag (for example 1.0.0-rc.1)"
            exit 1
          fi
          tag_exists=false
          if git rev-parse --verify --quiet "refs/tags/${tag}" > /dev/null; then
            tag_exists=true
          fi
          release_exists=false
          if [ "${tag_exists}" = "true" ] && gh release view "${tag}" > /dev/null 2>&1; then
            release_exists=true
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            # A dry run may preview the notes of a version that is not released
            # yet, so the existence checks only apply to real edits.
            echo "::notice::dry run: tag exists=${tag_exists}, release exists=${release_exists}"
          else
            if [ "${tag_exists}" != "true" ]; then
              echo "::error::the tag ${tag} does not exist; check the tag name"
              exit 1
            fi
            if [ "${release_exists}" != "true" ]; then
              echo "::error::no GitHub Release exists for ${tag}; publish the release first"
              exit 1
            fi
          fi
          echo "release tag: ${tag}; changelog source: ${REF} @ $(git rev-parse --short HEAD)"

      - name: Compose the release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP}/release-notes.md"
          # The script composes Header + the `## <tag>` section + Endfix and
          # derives the Full Changelog compare link from the nearest previous
          # release tag (all tags are fetched). A malformed changelog fails the
          # step before the release body is touched, so a failed run leaves the
          # published body as it was.
          node scripts/release-notes.ts "${TAG}" --tag "${TAG}" --output "${notes_file}"
          echo "notes_file=${notes_file}" >> "${GITHUB_OUTPUT}"
          echo "--- release notes (CHANGELOG.md Header + ## ${TAG} + Endfix) ---"
          cat "${notes_file}"

      - name: Update the GitHub Release body
        id: update
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "${TAG}" --notes-file "${{ steps.notes.outputs.notes_file }}"
          echo "release_status=notes regenerated from ${REF}" >> "${GITHUB_OUTPUT}"
          echo "::notice::release ${TAG} body regenerated from ${REF}"

      - name: Summarize
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          {
            echo "### Release notes ${TAG}"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| release tag | \`${TAG}\` |"
            echo "| changelog source | \`${REF}\` |"
            echo "| GitHub Release | ${{ steps.update.outputs.release_status || 'not edited' }} |"
            if [ "${DRY_RUN}" = "true" ]; then
              echo ""
              echo "> Dry run: the composed notes were not written to the release."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
