# .github/workflows/release.yml — publish a release from a version tag.
#
# Push a bare version tag — `<package.json version>` without a `v` prefix, for
# example 1.0.0-alpha.3 — and this workflow runs the full gate, packs the npm
# tarball, creates a GitHub Release titled `v<version>` whose body is composed
# from CHANGELOG.md (global Header + the `## <version>` section + global
# Endfix, with the Full Changelog compare link generated from the previous
# release tag; flagged as a pre-release for any semver prerelease: alpha, beta,
# rc, ...) and publishes the package to npm.
#
# npm authentication is OIDC Trusted Publishing: `id-token: write` lets npm
# exchange the job's GitHub-signed identity token for a short-lived registry
# credential, so no npm token is stored in this repository. npmjs.com must have
# a trusted publisher for this repository and this workflow file, and the
# package must already exist there — see PUBLISHING.md for the one-time setup.
#
# npm publishing is gated by the NPM_PUBLISH_ENABLED repository variable: while
# it is unset, a release still ships the GitHub Release and skips npm, so the
# one-time bootstrap can happen without breaking releases.
#
# The repository commits no build output: the tarball built here is the
# installable artifact, so a GitHub Release ships a ready-to-install package
# without a build step on the user's machine.
#
# Before composing the notes, the workflow lint-checks CHANGELOG.md with
# markdownlint. A changelog that fails the check must not reach a published
# release body: the build, the tarball and the GitHub Release still ship, but
# with an empty body, and the run is marked failed at the end. Fix the
# changelog on main, then use the release-notes workflow to regenerate the body
# for that tag (this workflow's manual run does the same from main's
# CHANGELOG.md, as part of a full retry).
#
# See PUBLISHING.md for the release checklist, the npm dist-tag policy and the
# trusted-publishing setup.
name: release

on:
  push:
    tags:
      # Bare versions only: `1.0.0-alpha.3`. The v prefix belongs to the
      # release commit subject and the GitHub Release title, not the tag.
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing bare version tag to release (for example 1.0.0-alpha.3); the notes are composed from CHANGELOG.md on main"
        required: true
        type: string
      dry_run:
        description: "Run the checks and build the tarball without creating a release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write # create the GitHub Release and upload the tarball
  id-token: write # npm OIDC trusted publishing + provenance attestations

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "12"
  # Keep in sync with ci.yml. markdownlint-cli2 requires Node >= 22.
  MARKDOWNLINT_VERSION: "0.23.3"

jobs:
  release:
    name: Release ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate the tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${TAG}"
          version="${tag}"
          pkg_version="$(node -p "require('./package.json').version")"

          if [[ "${tag}" == v* ]]; then
            echo "::error::release tags are bare versions (for example 1.0.0-alpha.3); the v prefix belongs to the release commit subject and the GitHub Release title"
            exit 1
          fi

          if [ "${version}" != "${pkg_version}" ]; then
            echo "::error::tag ${tag} does not match the package.json version ${pkg_version}"
            exit 1
          fi

          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::${version} is not a valid semantic version"
            exit 1
          fi

          # The tag must sit on the release commit: `release: v<version>`,
          # never a `chore:` / `chore(release):` header.
          expected_subject="release: v${version}"
          actual_subject="$(git log -1 --format=%s HEAD)"
          if [ "${actual_subject}" != "${expected_subject}" ]; then
            echo "::error::the release commit subject must be '${expected_subject}' (found '${actual_subject}'); version bumps never use the chore header"
            exit 1
          fi

          # Only release commits that already landed on main: a tag on an
          # unmerged branch would ship unreviewed code.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::${tag} is not reachable from main"
            exit 1
          fi

          # A semver prerelease (alpha/beta/rc/...) becomes a GitHub
          # pre-release and an npm prerelease dist-tag, so `latest` keeps
          # resolving to the last stable version.
          if [[ "${version}" == *-* ]]; then
            prerelease=true
            case "${version#*-}" in
              alpha.*|alpha) channel=alpha ;;
              beta.*|beta) channel=beta ;;
              rc.*|rc) channel=rc ;;
              *) channel=pre ;;
            esac
            npm_dist_tag=next
          else
            prerelease=false
            channel=stable
            npm_dist_tag=latest
          fi

          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "channel=${channel}"
            echo "npm_dist_tag=${npm_dist_tag}"
          } >> "${GITHUB_OUTPUT}"
          echo "tag ${tag}: version ${version}, channel ${channel}, prerelease=${prerelease}"

      - name: Lint CHANGELOG.md
        id: changelog_lint
        shell: bash
        run: |
          set -euo pipefail
          # A manual run validates the changelog it composes: main's copy,
          # because a fix lands after the tag (origin/main was fetched by the
          # tag validation step). A tag push validates the tag's own copy.
          changelog="CHANGELOG.md"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            changelog="${RUNNER_TEMP}/CHANGELOG.md"
            git show refs/remotes/origin/main:CHANGELOG.md > "${changelog}"
          fi
          echo "changelog=${changelog}" >> "${GITHUB_OUTPUT}"
          # A malformed changelog must not reach a published release body. The
          # failure is recorded, not raised: the build and the release still
          # ship with an empty body, and the final step marks the run failed so
          # the error cannot go unnoticed.
          if npx --yes "markdownlint-cli2@${MARKDOWNLINT_VERSION}" "${changelog}"; then
            echo "lint_ok=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::CHANGELOG.md passed markdownlint"
          else
            echo "lint_ok=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::CHANGELOG.md failed markdownlint; the release body is left empty"
          fi

      - name: Compose the release notes from CHANGELOG.md
        id: notes
        shell: bash
        env:
          CHANGELOG_LINT_OK: ${{ steps.changelog_lint.outputs.lint_ok }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          echo "notes_file=${notes_file}" >> "${GITHUB_OUTPUT}"

          if [ "${CHANGELOG_LINT_OK}" = "false" ]; then
            # Keep the invalid changelog out of the published release: the
            # release ships with an empty body, and a manual run for the same
            # tag regenerates the notes once the changelog is fixed.
            : > "${notes_file}"
            echo "notes_status=empty (CHANGELOG.md failed markdownlint)" >> "${GITHUB_OUTPUT}"
            echo "::warning::the release body is left empty because CHANGELOG.md failed markdownlint"
            exit 0
          fi

          # The lint step resolved the changelog source: main's copy on a manual
          # run (a fix lands after the tag), the tag's own copy on a tag push.
          changelog="${{ steps.changelog_lint.outputs.changelog }}"

          # The script composes Header + the version section + Endfix and turns
          # the Endfix placeholder into the Full Changelog compare link for this
          # tag's nearest previous release tag (full history is checked out).
          node scripts/release-notes.ts "${version}" --tag "${TAG}" --output "${notes_file}" --changelog "${changelog}"
          echo "notes_status=composed" >> "${GITHUB_OUTPUT}"
          echo "--- release notes (CHANGELOG.md Header + ## ${version} + Endfix) ---"
          cat "${notes_file}"

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify the build only writes generated files
        shell: bash
        run: |
          set -euo pipefail
          # lib/ and client/src/client.js are git-ignored build output; the
          # build must not modify anything that is tracked.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the build changed tracked files; generated output must stay untracked"
            git status --short
            git diff --stat
            exit 1
          fi

      - name: Pack the release tarball
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          rm -f ./*.tgz
          npm pack --silent > /dev/null
          tarball="$(ls -1 ./*.tgz | head -n 1)"
          echo "tarball=${tarball}" >> "${GITHUB_OUTPUT}"
          tar -tzf "${tarball}" | sort > pack-contents.txt
          cat pack-contents.txt
          for required in \
            package/package.json \
            package/lib/index.js \
            package/lib/client.js \
            package/lib/core/host.js \
            package/lib/types.js \
            package/client/src/client.js \
            package/cordis.patch.yml \
            package/README.md \
            package/LICENSE; do
            if ! grep -qx "${required}" pack-contents.txt; then
              echo "::error::tarball ${tarball} is missing ${required}"
              exit 1
            fi
          done

      - name: Upload the tarball as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-web-file-uploader-${{ steps.version.outputs.version }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

      - name: Create the GitHub release
        id: gh_release
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          version="${{ steps.version.outputs.version }}"
          release_title="v${version}"
          tarball="${{ steps.pack.outputs.tarball }}"
          notes_file="${{ steps.notes.outputs.notes_file }}"
          prerelease="${{ steps.version.outputs.prerelease }}"

          if gh release view "${tag}" > /dev/null 2>&1; then
            # A rerun must stay safe after the repository enables immutable
            # releases: their assets are locked, so only the editable
            # title/notes/flags are refreshed and the published tarball is kept.
            immutable="$(gh release view "${tag}" --json isImmutable --jq '.isImmutable')"
            if [ "${immutable}" = "true" ]; then
              expected_asset="$(basename "${tarball}")"
              published_assets="$(gh release view "${tag}" --json assets --jq '.assets[].name')"
              if ! printf '%s\n' "${published_assets}" | grep -x "${expected_asset}" > /dev/null; then
                echo "::error::immutable release ${tag} is missing ${expected_asset}; its assets cannot be replaced, so bump the version and publish a new release"
                exit 1
              fi
              echo "release ${tag} is immutable; keeping its assets and refreshing the title and notes"
              if [ "${prerelease}" = "true" ]; then
                gh release edit "${tag}" --title "${release_title}" --notes-file "${notes_file}" --prerelease
              else
                gh release edit "${tag}" --title "${release_title}" --notes-file "${notes_file}" --latest
              fi
              echo "release_status=existing immutable (assets kept)" >> "${GITHUB_OUTPUT}"
              echo "release_immutable=true" >> "${GITHUB_OUTPUT}"
            else
              echo "release ${tag} already exists; refreshing its tarball and notes"
              gh release upload "${tag}" "${tarball}" --clobber
              if [ "${prerelease}" = "true" ]; then
                gh release edit "${tag}" --title "${release_title}" --notes-file "${notes_file}" --prerelease
              else
                gh release edit "${tag}" --title "${release_title}" --notes-file "${notes_file}" --latest
              fi
              echo "release_status=updated" >> "${GITHUB_OUTPUT}"
              echo "release_immutable=${immutable}" >> "${GITHUB_OUTPUT}"
            fi
          elif [ "${prerelease}" = "true" ]; then
            gh release create "${tag}" "${tarball}" \
              --verify-tag \
              --title "${release_title}" \
              --notes-file "${notes_file}" \
              --prerelease
            echo "release_status=created (pre-release)" >> "${GITHUB_OUTPUT}"
            echo "release_immutable=$(gh release view "${tag}" --json isImmutable --jq '.isImmutable')" >> "${GITHUB_OUTPUT}"
          else
            gh release create "${tag}" "${tarball}" \
              --verify-tag \
              --title "${release_title}" \
              --notes-file "${notes_file}" \
              --latest
            echo "release_status=created" >> "${GITHUB_OUTPUT}"
            echo "release_immutable=$(gh release view "${tag}" --json isImmutable --jq '.isImmutable')" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish the npm release
        id: npm_publish
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        env:
          NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          if [ "${NPM_PUBLISH_ENABLED:-}" != "true" ]; then
            echo "::notice::npm publishing is disabled (repository variable NPM_PUBLISH_ENABLED is not 'true'); skipping."
            echo "npm_status=disabled (NPM_PUBLISH_ENABLED != true)" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          name="$(node -p "require('./package.json').name")"
          version="${{ steps.version.outputs.version }}"
          dist_tag="${{ steps.version.outputs.npm_dist_tag }}"

          if npm view "${name}@${version}" version > /dev/null 2>&1; then
            echo "::notice::${name}@${version} is already published; skipping."
            echo "npm_status=already published" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Provenance is generated by trusted publishing, but npm signs it only
          # when package.json#repository matches the publishing repository, so
          # fail with a clear message before the registry rejects the publish.
          expected_repo="git+https://github.com/${GITHUB_REPOSITORY}.git"
          actual_repo="$(node -p "require('./package.json').repository.url")"
          if [ "${actual_repo}" != "${expected_repo}" ]; then
            echo "::error::package.json repository.url is '${actual_repo}', expected '${expected_repo}'"
            exit 1
          fi

          publish_args=(--access public)
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            # Trusted publishing does not change npm's default dist-tag: a
            # prerelease would move `latest` unless it is sent to `next`.
            publish_args+=(--tag "${dist_tag}")
          fi

          # No NODE_AUTH_TOKEN: the workflow-level `id-token: write` lets npm
          # exchange the job's OIDC identity for a short-lived publish
          # credential, and trusted publishing signs the provenance statement.
          # npm >= 11.5.1 is required; the runner's bundled npm may be older, so
          # pin the major with npx.
          npx --yes --package 'npm@^11.5.1' npm publish "${publish_args[@]}"
          echo "npm_status=published (--tag ${dist_tag})" >> "${GITHUB_OUTPUT}"

      - name: Summarize
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          {
            echo "### Release ${TAG}"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| version | \`${{ steps.version.outputs.version }}\` |"
            echo "| channel | \`${{ steps.version.outputs.channel }}\` |"
            echo "| pre-release | \`${{ steps.version.outputs.prerelease }}\` |"
            echo "| CHANGELOG.md lint | ${{ steps.changelog_lint.outputs.lint_ok || 'not run' }} |"
            echo "| release notes | ${{ steps.notes.outputs.notes_status || 'not run' }} |"
            echo "| release title | \`v${{ steps.version.outputs.version }}\` |"
            echo "| GitHub Release | ${{ steps.gh_release.outputs.release_status || 'not created' }} |"
            echo "| release immutable | \`${{ steps.gh_release.outputs.release_immutable || 'n/a' }}\` |"
            echo "| npm publish | ${{ steps.npm_publish.outputs.npm_status || 'not run' }} |"
            echo "| npm dist-tag | \`${{ steps.version.outputs.npm_dist_tag }}\` |"
            echo "| tarball | \`${{ steps.pack.outputs.tarball }}\` |"
            tarball="${{ steps.pack.outputs.tarball }}"
            if [ -n "${tarball}" ] && [ "${DRY_RUN}" != "true" ]; then
              echo ""
              echo "Install this build:"
              echo ""
              echo '```bash'
              echo "dsh plugin --profile web add https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "${tarball}")"
              echo '```'
            fi
            if [ "${DRY_RUN}" = "true" ]; then
              echo ""
              echo "> Dry run: no GitHub Release was created and nothing was published."
            fi
            if [ "${{ steps.changelog_lint.outputs.lint_ok }}" = "false" ]; then
              echo ""
              echo "> **CHANGELOG.md failed markdownlint.** The release body is empty. Fix CHANGELOG.md on main, then run *Actions → release-notes → Run workflow* for \`${TAG}\` to regenerate the notes."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail the run when CHANGELOG.md failed markdownlint
        if: steps.changelog_lint.outputs.lint_ok == 'false'
        shell: bash
        run: |
          echo "::error::CHANGELOG.md failed markdownlint; release ${TAG} was published with an empty body. Fix CHANGELOG.md on main, then run the release-notes workflow manually for ${TAG} to regenerate the notes."
          exit 1
